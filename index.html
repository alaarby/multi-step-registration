<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Step Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site" id="page">
        <div class="container">
            <div class="form-box">
                <div class="progress">
                    <div class="logo">
                        <a href="#"><span>.web</span>design</a>
                    </div>
                    <ul class="progress-steps">
                        <li class="step active">
                            <span>1</span>
                            <p>Personal<br><span>25 sec to complete</span></p>
                        </li>
                        <li class="step">
                            <span>2</span>
                            <p>Contact<br><span>60 sec to complete</span></p>
                        </li>
                        <li class="step">
                            <span>3</span>
                            <p>Security<br><span>30 sec to complete</span></p>        
                        </li>
                    </ul>
                </div>
                <form>
                    <div class="form-one form-step active">
                        <div class="bg-svg"></div>
                        <h2>Personal Information</h2>
                        <p>Enter your personal information correctly</p>        
                        <div>
                            <label>First Name</label>
                            <input type="text" placeholder="e.g Alaa"/>
                        </div>
                        <div>
                            <label>Last Name</label>
                            <input type="text" placeholder="e.g Rabaya"/>
                        </div>
                        <div class="birth">
                            <label>Date of Birth</label>
                            <div class="grouping">
                                <input type="text" pattern="[0-9]" name="day" value="" min="0" max="31" placeholder="DD"/>
                                <input type="text" pattern="[0-9]" name="month" value="" min="0" max="12" placeholder="MM"/>
                                <input type="text" pattern="[0-9]" name="year" value="" min="1960" max="2050" placeholder="YYYY"/>
                                        
                            </div>    
                        </div>    
                    </div>
                    <div class="form-two form-step">
                        <div class="bg-svg"></div>
                        <h2>Contact</h2>
                        <p>Enter your contact infotmation correctly</p>
                        
                        <div>
                            <label>Phone</label>
                            <input type="tel" pattern="[0-9]" placeholder="e.g 05********">
                        </div>
                        <div>
                            <label>Address</label>
                            <input type="text" placeholder="Street Address ">
                        </div>
                        <div>
                            <label>City</label>
                            <input type="text" placeholder="City">
                        </div>
                        <div>
                            <label>Zip Code</label>
                            <input type="number" placeholder="Postal/Zip Code">
                        </div>
                        <div>
                            <label>Country</label>
                            <select name="country" id="country">
                                <option>Please select</option>
                                <option value="egypt">Egypt</option>
                                <option value="saudi-arabia">Saudi Arabia</option>
                                <option value="uae">United Arab Emirates</option>
                                <option value="algeria">Algeria</option>
                                <option value="bahrain">Bahrain</option>
                                <option value="comoros">Comoros</option>
                                <option value="djibouti">Djibouti</option>
                                <option value="iraq">Iraq</option>
                                <option value="jordan">Jordan</option>
                                <option value="kuwait">Kuwait</option>
                                <option value="lebanon">Lebanon</option>
                                <option value="libya">Libya</option>
                                <option value="mauritania">Mauritania</option>
                                <option value="morocco">Morocco</option>
                                <option value="oman">Oman</option>
                                <option value="palestine">Palestine</option>
                                <option value="qatar">Qatar</option>
                                <option value="somalia">Somalia</option>
                                <option value="sudan">Sudan</option>
                                <option value="syria">Syria</option>
                                <option value="tunisia">Tunisia</option>
                                <option value="yemen">Yemen</option>
                            </select>   
                        </div>
                    </div>
                    <div class="form-three form-step">
                        <div class="bg-svg"></div>
                            <h2>Security</h2>
                            <p></p>
                        
                        <div>
                            <label>Email</label>
                            <input type="email" name="" id="" placeholder="Your email Address">
                        </div>
                        <div>
                            <label>Username</label>
                            <input type="text" name="" id="" placeholder="Username">
                        </div>
                        <div>
                            <label>Password</label>
                            <input type="password" name="" id="" placeholder="Password">
                        </div>
                        <div>
                            <input type="password" name="" id="" placeholder="Confirm Password">
                        </div>
                        <div class="checkbox">
                            <input type="checkbox">  
                            <label>Receive our news letter and special offers</label>              
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-prev" disabled>Back</button>
                        <button class="btn-next">Next step</button>
                        <button class="btn-submit">Submit</button>
                    </div>    
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script type="text/javascript" src="script.js"></script>
</body>
</html>
